name: on-chain daily report

on:
  schedule:
    - cron: "17 1 * * *"   # daily 01:17 UTC
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pipeline (generate -> dbt build incl. data tests -> analysis -> report)
        run: python pipeline.py
      - name: Unit + ground-truth tests
        run: python -m pytest -q tests
      - name: Publish report to job summary
        run: cat reports/output/latest_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: onchain-report
          path: |
            reports/output/
          retention-days: 30
